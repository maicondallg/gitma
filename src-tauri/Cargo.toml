[package]
name = "gitma-desktop"
version = "0.1.2"
edition = "2021"
description = "Gitma Desktop native application powered by Tauri v2 and Rust"
license = "MIT"
authors = ["Maicon Dall'Agnol <maicon.dallagnol@unesp.br>"]
repository = "https://github.com/maicondallg/Gitma"
default-run = "gitma-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitma-core = { path = "../crates/gitma-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

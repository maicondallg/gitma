[package]
name = "gitma-core"
version.workspace = true
edition.workspace = true
description = "Core domain logic, Git process runner, graph layout engine, and diff service for Gitma"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
